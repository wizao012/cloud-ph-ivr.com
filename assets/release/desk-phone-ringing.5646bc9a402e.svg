<svg xmlns="http://www.w3.org/2000/svg" width="100" height="84" viewBox="0 0 100 84" fill="none">
  <style>
    .receiver{transform-origin:50px 37px;animation:ring 2.6s ease-in-out infinite}
    .waves{animation:pulse 2.6s ease-in-out infinite}
    @keyframes ring{0%,10%,20%,30%,100%{transform:rotate(0)}5%,25%{transform:rotate(-3deg)}15%{transform:rotate(3deg)}}
    @keyframes pulse{0%,30%,100%{opacity:.45}10%,20%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.receiver,.waves{animation:none}}
  </style>
  <g class="waves" stroke="#0b7875" stroke-width="3" stroke-linecap="round">
    <path d="M17 14 12 8m15 3-2-7M83 14l5-6m-15 3 2-7"/>
  </g>
