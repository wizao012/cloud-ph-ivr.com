  <rect x="35" y="41" width="30" height="9" rx="2" fill="#d8eeeb" stroke="#0b7875" stroke-width="1.6"/>
  <g fill="#0058a8"><rect x="35" y="56" width="8" height="4" rx="1"/><rect x="47" y="56" width="8" height="4" rx="1"/><rect x="59" y="56" width="8" height="4" rx="1"/><rect x="35" y="63" width="8" height="4" rx="1"/><rect x="47" y="63" width="8" height="4" rx="1"/><rect x="59" y="63" width="8" height="4" rx="1"/></g>
  <g class="receiver"><path d="M18 30c3-10 17-15 32-15s29 5 32 15v7c0 3-3 5-6 5h-8c-3 0-5-2-5-5v-6c-8-3-18-3-26 0v6c0 3-2 5-5 5h-8c-3 0-6-2-6-5v-7Z" fill="#0058a8" stroke="#00285d" stroke-width="2.8" stroke-linejoin="round"/></g>
</svg>
